# Whenever a tag push matching pattern "v*" then run the job
on: 
  push:
    branches: 
      - master

jobs:
  export_game:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    name: Export Game
    steps:
    - name: checkout
      uses: actions/checkout@v5

    - name: Install rcedit
      run: |
        sudo apt-get update
        sudo apt-get install -y wine
        wget https://github.com/electron/rcedit/releases/download/v1.1.1/rcedit-x64.exe -O rcedit.exe

    - name: export game
      id: export
      uses: firebelley/godot-export@v7.0.0
      with:
        godot_executable_download_url: https://downloads.godotengine.org/?version=4.7.2&flavor=stable&slug=mono_linux_x86_64.zip&platform=linux.64
        godot_export_templates_download_url: https://downloads.godotengine.org/?version=4.7.2&flavor=stable&slug=mono_export_templates.tpz&platform=templates
        relative_project_path: ./
        archive_output: true
        cache: true
        rcedit_path: "./rcedit.exe"

    - name: create release
      uses: ncipollo/release-action@v1.18.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        generateReleaseNotes: true
        tag: "nightly"
        artifacts: ${{ steps.export.outputs.archive_directory }}/*
        allowUpdates: true
        removeArtifacts: true
        replaceArtifacts: true
