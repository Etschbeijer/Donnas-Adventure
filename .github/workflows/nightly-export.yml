name: Export Game

# Keep nightly builds on main and attach builds to published releases.
on: 
  push:
    branches: 
      - main
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build (leave blank for nightly)
        required: false
        type: string

concurrency:
  group: export-${{ github.event.release.tag_name || inputs.release_tag || 'nightly' }}
  cancel-in-progress: false

jobs:
  export_game:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    name: Export Game
    steps:
    - name: checkout
      uses: actions/checkout@v5
      with:
        ref: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}

    - name: Verify existing release for manual build
      if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install Wine
      id: wine
      run: |
        sudo apt-get update
        sudo apt-get install -y wine
        echo "path=$(command -v wine)" >> "$GITHUB_OUTPUT"

    - name: export game
      id: export
      uses: firebelley/godot-export@v7.0.0
      with:
        godot_executable_download_url: https://downloads.godotengine.org/?version=4.7.2&flavor=stable&slug=mono_linux_x86_64.zip&platform=linux.64
        godot_export_templates_download_url: https://downloads.godotengine.org/?version=4.7.2&flavor=stable&slug=mono_export_templates.tpz&platform=templates
        relative_project_path: ./
        archive_output: true
        cache: true
        wine_path: ${{ steps.wine.outputs.path }}

    - name: Normalize release archive names
      shell: bash
      env:
        ARCHIVE_DIRECTORY: ${{ steps.export.outputs.archive_directory }}
      run: |
        set -euo pipefail
        # Match GitHub's stored asset names so replacement finds existing uploads.
        shopt -s nullglob
        archives=("$ARCHIVE_DIRECTORY"/*.zip)
        if (( ${#archives[@]} == 0 )); then
          echo "No release archives found in $ARCHIVE_DIRECTORY" >&2
          exit 1
        fi
        for archive in "${archives[@]}"; do
          filename="${archive##*/}"
          normalized="${filename// /.}"
          if [[ "$filename" == "$normalized" ]]; then
            continue
          fi
          destination="$ARCHIVE_DIRECTORY/$normalized"
          if [[ -e "$destination" ]]; then
            echo "Archive name collision: $normalized" >&2
            exit 1
          fi
          mv -- "$archive" "$destination"
        done

    - name: create release
      uses: ncipollo/release-action@v1.18.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        generateReleaseNotes: true
        tag: ${{ github.event.release.tag_name || inputs.release_tag || 'nightly' }}
        commit: ${{ github.sha }}
        artifacts: ${{ steps.export.outputs.archive_directory }}/*.zip
        allowUpdates: true
        omitBodyDuringUpdate: true
        omitNameDuringUpdate: true
        omitDraftDuringUpdate: true
        omitPrereleaseDuringUpdate: true
        artifactErrorsFailBuild: true
        removeArtifacts: false
        replacesArtifacts: true
