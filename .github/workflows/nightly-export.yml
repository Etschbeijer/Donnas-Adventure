# Run nightly exports on pushes to master
on:
  push:
    branches:
      - master

jobs:
  export_game:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    name: Export Game

    # Matrix allows running multiple OS exports in parallel
    strategy:
      matrix:
        platform: [windows, linux, macos]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Export Godot Project
        id: export
        uses: firebelley/godot-export@v7.0.0
        with:
          godot_executable_download_url: https://downloads.godotengine.org/?version=4.4&flavor=stable&slug=mono_linux_x86_64.zip&platform=linux.64
          godot_export_templates_download_url: https://downloads.godotengine.org/?version=4.4&flavor=stable&slug=mono_export_templates.tpz&platform=templates
          relative_project_path: ./
          archive_output: true
          cache: true
          export_preset: ${{ matrix.platform == 'windows' && 'Windows' || matrix.platform == 'linux' && 'Linux/X11' || 'Mac OSX' }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: ${{ steps.export.outputs.archive_directory }}/*

  create_release:
    runs-on: ubuntu-latest
    needs: export_game
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1.18.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: nightly
          generateReleaseNotes: true
          artifacts: ./artifacts/*
          allowUpdates: true
          removeArtifacts: true
          replaceArtifacts: true
